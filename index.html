<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .joke-text {
            font-weight: 500;
        }

        .loading {
            display: none;
            color: #667eea;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-joke {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-joke:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-joke:active {
            transform: translateY(0);
        }

        .btn-copy {
            background: #f0f0f0;
            color: #333;
        }

        .btn-copy:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .joke-type {
            margin-bottom: 20px;
        }

        .joke-type label {
            color: #666;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 400;
            margin: 0;
        }

        input[type="radio"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .info {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }

        .copy-feedback {
            display: none;
            color: #667eea;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }

            .joke-box {
                min-height: 120px;
                padding: 30px 20px;
                font-size: 16px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time</p>

        <div class="joke-type">
            <label>Joke Type:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="jokeType" value="any" checked> Any
                </label>
                <label>
                    <input type="radio" name="jokeType" value="general"> General
                </label>
                <label>
                    <input type="radio" name="jokeType" value="programming"> Programming
                </label>
                <label>
                    <input type="radio" name="jokeType" value="knock-knock"> Knock-Knock
                </label>
            </div>
        </div>

        <div class="joke-box">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching a joke...</p>
            </div>
            <div class="joke-text" id="jokeText">Click "Get Joke" to start laughing!</div>
        </div>

        <div class="button-group">
            <button class="btn-joke" onclick="getJoke()">Get Joke</button>
            <button class="btn-copy" onclick="copyJoke()">📋 Copy</button>
        </div>

        <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>

        <div class="info">
            <p>💡 Powered by <a href="https://official-joke-api.appspot.com/" target="_blank" style="color: #667eea; text-decoration: none;">Official Joke API</a></p>
        </div>
    </div>

    <script>
        let currentJoke = "Click 'Get Joke' to start laughing!";

        async function getJoke() {
            const jokeType = document.querySelector('input[name="jokeType"]:checked').value;
            const loading = document.getElementById('loading');
            const jokeText = document.getElementById('jokeText');
            const copyFeedback = document.getElementById('copyFeedback');

            // Hide feedback and show loading
            copyFeedback.style.display = 'none';
            jokeText.style.display = 'none';
            loading.style.display = 'block';

            try {
                let url;
                if (jokeType === 'any') {
                    url = 'https://official-joke-api.appspot.com/random_joke';
                } else {
                    url = `https://official-joke-api.appspot.com/jokes/${jokeType}/random`;
                }

                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                
                // Handle both single joke and array response
                const joke = Array.isArray(data) ? data[0] : data;
                
                // Format the joke
                if (joke.type === 'knock-knock') {
                    currentJoke = `${joke.setup}\n${joke.delivery}`;
                } else {
                    currentJoke = `${joke.setup}\n\n${joke.punchline}`;
                }

                jokeText.innerHTML = currentJoke.replace(/\n/g, '<br>');
                loading.style.display = 'none';
                jokeText.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                currentJoke = "Oops! Couldn't fetch a joke. Please try again.";
                jokeText.innerHTML = currentJoke;
                loading.style.display = 'none';
                jokeText.style.display = 'block';
            }
        }

        function copyJoke() {
            const plainText = currentJoke.replace(/<br>/g, '\n');
            navigator.clipboard.writeText(plainText).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            }).catch(() => {
                alert('Failed to copy!');
            });
        }

        // Auto-load a joke when page loads
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
